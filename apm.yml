    # TypeScript / monorepo quality
    - mizchi/skills/frontend/review-hygiene
    - mizchi/skills/frontend/review-testing
    - mizchi/skills/frontend/review-deps
    # CI & changelog
    - mizchi/skills/devops/gh-fix-ci
    - mizchi/skills/tooling/conventional-changelog
    # APM reference
    - mizchi/skills/tooling/apm-usage
  mcp: []
includes: auto
scripts: {}
