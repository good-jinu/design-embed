name: Publish packages to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta
      dry_run:
        description: Pack packages without publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  NPM_CONFIG_PROVENANCE: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3

      - name: Configure npm registry
        run: |
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Verify package set
        run: node scripts/verify-npm-package-set.mjs

      - name: Test
        run: pnpm test

      - name: Check docs
        run: pnpm docs:check

      - name: Build docs
        run: pnpm docs:build

      - name: Build packages
        run: pnpm build:packages

      - name: Pack public packages
        run: |
          mkdir -p npm-packages
          pnpm --config.node-linker=hoisted --dir packages/design-embed pack --pack-destination ../../npm-packages
          pnpm --config.node-linker=hoisted --dir packages/plugin-figma-html pack --pack-destination ../../npm-packages
          pnpm --config.node-linker=hoisted --dir packages/target-react pack --pack-destination ../../npm-packages
          pnpm --config.node-linker=hoisted --dir packages/target-html pack --pack-destination ../../npm-packages

      - name: List package tarballs
        run: ls -la npm-packages

      - name: Publish public packages
        if: ${{ !inputs.dry_run }}
        run: |
          NPM_TAG="${{ inputs.tag || 'latest' }}"
          pnpm --config.node-linker=hoisted --dir packages/target-html publish --access public --provenance --tag "$NPM_TAG" --no-git-checks
          pnpm --config.node-linker=hoisted --dir packages/target-react publish --access public --provenance --tag "$NPM_TAG" --no-git-checks
          pnpm --config.node-linker=hoisted --dir packages/plugin-figma-html publish --access public --provenance --tag "$NPM_TAG" --no-git-checks
          pnpm --config.node-linker=hoisted --dir packages/design-embed publish --access public --provenance --tag "$NPM_TAG" --no-git-checks
